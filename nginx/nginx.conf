worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Re-resolve recreated Compose services without restarting the gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend {
        zone backend 64k;
        server api:3000 resolve;
    }
    upstream frontend {
        zone frontend 64k;
        server angular:FRONTEND_PORT resolve;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_user_agent $share_bot {
        default 0;
        ~*(whatsapp|facebookexternalhit|twitterbot|linkedinbot|telegrambot|slackbot|discordbot) 1;
    }

    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Preserve the entire /api URI (including version and Swagger assets).
        location = /api {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }
        location /api/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }
        # Social crawlers do not execute the Angular bundle. Give them the
        # server-rendered Open Graph document for public roadmap URLs.
        location ~ "^/(roadmaps|modelos)/([0-9a-fA-F-]{36})$" {
            set $share_upstream frontend;
            set $share_uri $uri;
            if ($share_bot) { set $share_upstream backend; }
            if ($share_bot) { set $share_uri /api/v1/share/roadmaps/$2; }
            proxy_pass http://$share_upstream$share_uri;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
