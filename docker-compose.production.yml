# Standalone production-like stack: use -f with this file alone.
name: roadmaps-production

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: breadcrumbs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: breadcrumbs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U breadcrumbs -d breadcrumbs']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [application]

  api:
    build:
      context: ./API
      target: production
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SWAGGER_ENABLED: ${PRODUCTION_SWAGGER_ENABLED:-false}
      TRUST_PROXY: 'true'
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://breadcrumbs:${POSTGRES_PASSWORD:-}@postgres:5432/breadcrumbs}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://roadmaps.gabrielcapoia.dev}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [application]

  angular:
    build:
      context: ./ANGULAR
      target: production
    restart: unless-stopped
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [application]

  nginx:
    build:
      context: ./nginx
      args:
        FRONTEND_PORT: 8080
    restart: unless-stopped
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
      angular:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [application]

networks:
  application:

volumes:
  postgres_data:
